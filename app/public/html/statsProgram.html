<main class="stats-program">
    <header id="header">
        <h2>Player Statistics</h2>
        <div class="flex gap-2 justify-center mt-2 mb-4">
            <button id="pong-stats-btn" class="btn-win98 active-game">PONG</button>
            <button id="peow-stats-btn" class="btn-win98">PEOW</button>
        </div>
    </header>
    <section id="summary" class="flex gap-2 justify-evenly" role="region" aria-label="Game statistics summary"> 
        <article class="stat-card">
            <h3>Total Games</h3>
            <span id="total-games" class="stat-number">0</span>
        </article>
        <article class="stat-card">
            <h3>Total Wins</h3>
            <span id="total-wins" class="stat-number">0</span>
        </article>
        <article class="stat-card">
            <h3>Total Losses</h3>
            <span id="total-losses" class="stat-number">0</span>
        </article>
    </section>
    <div id="match-list">

    </div>
</main>
