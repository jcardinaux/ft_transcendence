<div class="window-frame-win98 match-card">
    <div class="title-bar-win98">
        <span class="game-name">Game Name</span>
        <span class="match-id">#000</span>
    </div>
    
    <div class="window-content-win98">
        <div class="match-info">
            <div class="players-section">
                <div class="player player1">
                    <span class="player-label">Player 1:</span>
                    <span class="player1-id">000</span>
                </div>
                
                <div class="vs-separator">VS</div>
                
                <div class="player player2">
                    <span class="player-label">Player 2:</span>
                    <span class="player2-id">000</span>
                </div>
            </div>
            
            <div class="match-result">
                <div class="score-section">
                    <span class="score-label">Score:</span>
                    <span class="score">0-0</span>
                </div>
                
                <div class="winner-section">
                    <span class="winner-label">Winner:</span>
                    <span class="winner-id">Player 0</span>
                </div>
            </div>
            
            <div class="match-details">
                <div class="date-section">
                    <span class="date-label">Date:</span>
                    <span class="match-date">01/01/2025</span>
                </div>
            </div>
        </div>
    </div>
</div>
